[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "garcia-systems-lab-skeleton"
dynamic = ["version"]
description = "A reusable foundation for deterministic executable laboratories."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
authors = [{ name = "Garcia Systems" }]
keywords = ["education", "simulation", "deterministic-systems"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Education",
]
dependencies = []

[project.urls]
Documentation = "https://github.com/Garcia-Systems/lab-skeleton#readme"
Issues = "https://github.com/Garcia-Systems/lab-skeleton/issues"
Source = "https://github.com/Garcia-Systems/lab-skeleton"

[project.optional-dependencies]
dev = [
    "build>=1.2,<2",
    "pytest>=8.3,<9",
    "pytest-cov>=6,<7",
    "ruff>=0.11,<0.12",
    "twine>=6,<7",
]

[project.scripts]
lab-sim = "lab_sim.cli:main"

[tool.hatch.version]
path = "src/lab_sim/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/lab_sim"]

[tool.hatch.build.targets.sdist]
include = ["/CONTRIBUTING.md", "/LICENSE", "/README.md", "/book", "/diagrams", "/docs", "/pyproject.toml", "/src", "/tests"]

[tool.pytest.ini_options]
addopts = "-ra"
cache_dir = "/tmp/pytest-cache"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
data_file = "/tmp/lab-skeleton.coverage"
source = ["lab_sim"]

[tool.coverage.report]
show_missing = true

[tool.coverage.xml]
output = "coverage.xml"

[tool.ruff]
cache-dir = "/tmp/ruff-cache"
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
